# Configuración de despliegue (HU-014).
# Netlify detecta Next.js y aplica su adaptador automáticamente; aquí solo se
# fija lo que no conviene dejar al azar.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Los scripts de ingesta ejecutan TypeScript directamente con Node, lo que
  # exige una versión moderna. Se fija para que el build no cambie de runtime
  # sin avisar.
  NODE_VERSION = "24"
  # Dirección base de la instancia publicada. La usa el enlace de acceso por
  # correo (`urlSitio()`, en src/lib/auth/sitio.ts) para saber a dónde tiene que
  # volver; sin ella cae en la canónica del titular, que aquí es la misma, pero
  # entonces esa vuelta depende de un dato pensado para el sitemap.
  #
  # Va aquí y no en el panel de Netlify a propósito: no es un secreto —el
  # prefijo NEXT_PUBLIC_ la incrusta en el bundle del navegador— y en el panel
  # no habría diff ni historial de quién la cambió.
  #
  # Ojo: NEXT_PUBLIC_ se resuelve al compilar, no al ejecutar. Cambiar esto
  # exige volver a publicar para que surta efecto.
  NEXT_PUBLIC_SITE_URL = "https://gourses.com"

# Cabeceras de seguridad.
[[headers]]
  for = "/*"
  [headers.values]
    # Desde HU-018 hay cookies de sesión, así que la primera visita por http://
    # dejaría de ser inofensiva: obliga al navegador a no intentarlo siquiera.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Evita que el navegador adivine el tipo de contenido.
    X-Content-Type-Options = "nosniff"
    # Impide que el sitio se incruste en un iframe ajeno.
    X-Frame-Options = "DENY"
    # No filtrar la URL completa al salir hacia las plataformas de cursos.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # El sitio no necesita ninguna de estas capacidades del navegador.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
